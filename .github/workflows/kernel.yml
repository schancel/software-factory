name: Kernel lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Advisory documentation lint
        run: .agents/scripts/test-skill-docs
      - name: Script tests
        run: |
          python3 .agents/scripts/test_ticket_triage.py
          python3 .agents/scripts/test_ticket_poset.py
          python3 .agents/scripts/test_ready_queue.py
          python3 .agents/scripts/test_issue_export.py
          python3 .agents/scripts/test_emit_claim.py
          python3 .agents/scripts/test_issue_worktree.py
        # Run from repo root. Do not set working-directory to .agents/scripts
        # or these paths double (.agents/scripts/.agents/scripts/...).
      - name: Install script
        run: sh test-install.sh
