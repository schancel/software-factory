name: Kernel lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Advisory documentation lint
        run: .agents/scripts/test-skill-docs
      - name: Queue score report tests
        run: python3 .agents/scripts/test_ticket_triage.py
        working-directory: .agents/scripts
      - name: Ticket poset wave tests
        run: python3 .agents/scripts/test_ticket_poset.py
